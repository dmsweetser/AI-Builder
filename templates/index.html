<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Builder</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="icon" href="/static/favicon.png" type="image/png">
</head>
<body>
    <!-- Minecraft Loading Screen -->
    <div id="loading-screen">
        <div class="moose-container">
            <div class="moose-body"></div>
            <div class="moose-humps">
                <div class="moose-hump moose-hump-1"></div>
                <div class="moose-hump moose-hump-2"></div>
            </div>
            <div class="moose-legs">
                <div class="moose-leg"></div>
                <div class="moose-leg"></div>
                <div class="moose-leg"></div>
                <div class="moose-leg"></div>
            </div>
            <div class="moose-head">
                <div class="moose-ear"></div>
                <div class="moose-eye"></div>
                <div class="moose-blush"></div>
                <div class="moose-teeth"></div>
                <div class="moose-nostril moose-nostril-left"></div>
                <div class="moose-nostril moose-nostril-right"></div>
            </div>
            <!-- Moose Neck -->
            <div class="moose-neck"></div>
            <!-- Dewlap (bell fold under neck) -->
            <div class="moose-dewlap"></div>
            <!-- Moose Snout -->
            <div class="moose-snout"></div>
            <!-- Hanging Bell -->
            <div class="moose-bell"></div>
            <!-- Antlers (sibling, positioned relative to head) -->
            <div class="moose-antlers" style="top:-52px;left:-12px;">
                <div class="moose-antler moose-antler-1"></div>
                <div class="moose-antler moose-antler-2"></div>
            </div>
            <div class="moose-tail"></div>
            <div class="moose-saddle-blanket"></div>
            <div class="moose-saddle"></div>
            <div class="moose-shadow"></div>
            <div class="moose-dust moose-dust-1"></div>
            <div class="moose-dust moose-dust-2"></div>
            <div class="moose-dust moose-dust-3"></div>
        </div>
        <div class="loading-text">LOADING AI BUILDER...</div>
        <div class="loading-bar-container">
            <div class="loading-bar"></div>
        </div>
    </div>

    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>⛏️ AI BUILDER</h1>
            </div>
            <nav class="sidebar-nav" role="navigation" aria-label="Main navigation">
                <button class="tab-btn active" data-tab="projects" aria-selected="true" tabindex="0">
                    <span class="nav-icon">📁</span> Projects
                </button>
                <button class="tab-btn" data-tab="chat" aria-selected="false" tabindex="-1">
                    <span class="nav-icon">💬</span> Chat
                </button>
                <button class="tab-btn" data-tab="settings" aria-selected="false" tabindex="-1">
                    <span class="nav-icon">⚡</span> Settings
                </button>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Projects Panel -->
            <div id="projects-panel" class="panel active" role="tabpanel">
                <div class="panel-header">
                    <h2>Projects</h2>
                    <div class="header-actions">
                        <button class="btn btn-secondary" id="show-archived-btn" onclick="toggleArchived()">SHOW ARCHIVED</button>
                        <button class="btn btn-primary" id="show-create-form" onclick="toggleCreateForm()">+ NEW PROJECT</button>
                    </div>
                </div>

                <!-- Create Project Form -->
                <div id="create-project-form" class="create-form" style="display:none;">
                    <h3>Create New Project</h3>
                    <form id="add-project-form">
                        <div class="form-group">
                            <label for="add-project-name">Project Name *</label>
                            <input type="text" id="add-project-name" name="name" required placeholder="My Cool Project">
                        </div>
                        <div class="form-group">
                            <label for="add-root-path">Root Directory *</label>
                            <input type="text" id="add-root-path" name="rootDirectory" required placeholder="/path/to/your/project">
                        </div>
                        <div class="form-group">
                            <label for="add-instructions">Instructions</label>
                            <textarea id="add-instructions" name="instructions" rows="4" placeholder="What should the agent do?"></textarea>
                        </div>
                        <div class="form-group">
                            <label>Disable These Tools</label>
                            <div id="add-tool-selector" class="tool-selector-grid"></div>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">CREATE PROJECT</button>
                            <button type="button" class="btn btn-secondary" onclick="toggleCreateForm()">CANCEL</button>
                        </div>
                    </form>
                </div>

                <!-- Project List -->
                <div id="project-list" class="project-list" role="list">
                    <div class="loading">Loading projects...</div>
                </div>
            </div>

            <!-- Project Details Panel -->
            <div id="project-details-panel" class="panel" role="tabpanel">
                <div class="panel-header">
                    <button class="btn btn-secondary" onclick="goBackToProjects()">← BACK</button>
                    <h2 id="details-project-name">Project Details</h2>
                </div>

                <div id="project-config-section">
                    <form id="project-details-form" onsubmit="return false;">
                        <input type="hidden" id="run-project-id" name="id">

                        <div class="form-group">
                            <label for="details-project-name-form">Project Name</label>
                            <input type="text" id="details-project-name-form" name="name">
                        </div>

                        <div class="form-group">
                            <label for="details-root-dir">Root Directory</label>
                            <input type="text" id="details-root-dir" name="rootDirectory">
                        </div>

                        <div class="form-group">
                            <label for="details-instructions">Instructions</label>
                            <textarea id="details-instructions" name="instructions" rows="6"></textarea>
                        </div>

                        <div class="form-group">
                            <label>Disable These Tools By Unchecking Them</label>
                            <div id="details-tool-selector"></div>
                        </div>

                        <!-- Bash Tools Section -->
                        <div class="form-group" style="margin-top:20px; border-top:1px solid var(--border); padding-top:16px;">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                                <label style="font-size:14px; font-weight:bold;">⚡ BASH TOOLS (project-local scripts)</label>
                                <button type="button" class="btn btn-sm btn-primary" onclick="toggleBashToolForm()">+ NEW BASH TOOL</button>
                            </div>
                            <div id="bash-tools-list" style="margin-bottom:12px;">
                                <div style="color:var(--text-muted); font-size:12px;">Loading bash tools...</div>
                            </div>
                            <div id="bash-tool-form-container" style="display:none; background:var(--muted); padding:12px; border-radius:6px;">
                                <div style="margin-bottom:8px;">
                                    <label style="font-size:12px;">Tool Name *</label>
                                    <input type="text" id="bash-tool-name" placeholder="e.g., run_linter" style="width:100%; padding:6px; background:var(--bg-primary); border:1px solid var(--border); color:var(--text); border-radius:4px;">
                                </div>
                                <div style="margin-bottom:8px;">
                                    <label style="font-size:12px;">Description *</label>
                                    <input type="text" id="bash-tool-desc" placeholder="What does this tool do?" style="width:100%; padding:6px; background:var(--bg-primary); border:1px solid var(--border); color:var(--text); border-radius:4px;">
                                </div>
                                <div style="margin-bottom:8px;">
                                    <label style="font-size:12px;">Script Body *</label>
                                    <textarea id="bash-tool-script" rows="6" placeholder='echo "Processing..."' style="width:100%; padding:6px; background:var(--bg-primary); border:1px solid var(--border); color:var(--text); border-radius:4px; font-family:monospace; font-size:12px;"></textarea>
                                </div>
                                <div style="display:flex; gap:8px;">
                                    <button type="button" class="btn btn-sm btn-success" onclick="createBashTool()">CREATE</button>
                                    <button type="button" class="btn btn-sm btn-secondary" onclick="toggleBashToolForm()">CANCEL</button>
                                </div>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="button" class="btn btn-primary run-btn" id="details-run-btn" onclick="runProject(currentProjectId)">RUN AI BUILDER</button>
                            <button type="button" class="btn btn-info" id="details-live-btn" onclick="openViewInNewTabForCurrentProject()" style="display:none;">👁 VIEW</button>
                            <button type="button" class="btn btn-danger" id="details-stop-btn" onclick="stopProject(currentProjectId)" style="display:none;">STOP</button>
                            <button type="button" class="btn btn-secondary" onclick="resetProject(currentProjectId)">RESET</button>
                            <button type="button" class="btn btn-danger" onclick="deleteProject(currentProjectId)">DELETE</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Chat Panel -->
            <div id="chat-panel" class="panel" role="tabpanel">
                <div class="panel-header">
                    <h2>Chat</h2>
                    <div class="header-actions">
                        <button class="btn btn-secondary" onclick="loadChats()">REFRESH</button>
                        <button class="btn btn-primary" onclick="newChat()">+ NEW CHAT</button>
                    </div>
                </div>
                <div class="chat-container">
                    <div id="chat-list" class="chat-list" role="list">
                        <div class="loading">Loading chats...</div>
                    </div>
                    <div id="chat-view" class="chat-view" style="display:none;">
                        <div id="chat-log" class="chat-log" role="log" aria-live="polite"></div>
                        <div class="chat-controls" id="chat-controls-container" style="display:none;">
                            <textarea id="chat-input" placeholder="Type a message..." rows="3"></textarea>
                            <button class="btn btn-primary" id="send-chat-btn" onclick="sendChat()">SEND</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Settings Panel -->
            <div id="settings-panel" class="panel" role="tabpanel">
                <div class="panel-header">
                    <h2>Settings</h2>
                    <div class="header-actions">
                        <button class="btn btn-secondary" onclick="reloadSettingsFromDisk()">RELOAD FROM DISK</button>
                        <button class="btn btn-primary" onclick="saveSettings()">SAVE</button>
                    </div>
                </div>
                <form id="settings-form">
                    <div class="settings-grid">
                        <!-- Full-width text fields -->
                        <div class="setting-row full-width">
                            <label for="set-custom-endpoint-url">Endpoint URL</label>
                            <input type="text" id="set-custom-endpoint-url" name="custom_endpoint_url" placeholder="http://127.0.0.1:8080/v1/chat/completions">
                        </div>
                        <div class="setting-row full-width">
                            <label for="set-custom-api-key">API Key</label>
                            <input type="text" id="set-custom-api-key" name="custom_api_key" placeholder="«redacted:sk-…»">
                        </div>
                        <div class="setting-row full-width">
                            <label for="set-custom-model-name">Model Name</label>
                            <input type="text" id="set-custom-model-name" name="custom_model_name" placeholder="qwen36">
                        </div>
                        <div class="setting-row">
                            <label for="set-custom-verify-ssl">Verify SSL</label>
                            <input type="checkbox" id="set-custom-verify-ssl" name="custom_verify_ssl">
                        </div>
                        <!-- Number fields (compact) -->
                        <div class="setting-row">
                            <label for="set-max-steps">Max Steps</label>
                            <input type="number" id="set-max-steps" name="max_steps" value="500">
                        </div>
                        <div class="setting-row">
                            <label for="set-timeout">Timeout (seconds)</label>
                            <input type="number" id="set-timeout" name="timeout" value="7200">
                        </div>
                        <div class="setting-row">
                            <label for="set-max-context-tokens">Max Context Tokens</label>
                            <input type="number" id="set-max-context-tokens" name="max_context_tokens" value="262144">
                        </div>
                        <div class="setting-row">
                            <label for="set-max-output-tokens">Max Output Tokens</label>
                            <input type="number" id="set-max-output-tokens" name="max_output_tokens" value="131072">
                        </div>
                        <div class="setting-row">
                            <label for="set-max-tool-result-length">Max Tool Result Length</label>
                            <input type="number" id="set-max-tool-result-length" name="max_tool_result_length" value="10000">
                        </div>
                        <!-- Full-width path fields -->
                        <div class="setting-row full-width">
                            <label for="set-root-dir">Default Root Directory</label>
                            <input type="text" id="set-root-dir" name="root_directory" placeholder="/path/to/default">
                        </div>
                        <div class="setting-row full-width">
                            <label for="set-jd-cli">JD CLI Path</label>
                            <input type="text" id="set-jd-cli" name="jd_cli_path" placeholder="/path/to/jd-cli">
                        </div>
                        <div class="setting-row full-width">
                            <label for="set-java-home">Java Home</label>
                            <input type="text" id="set-java-home" name="java_home" placeholder="/path/to/java">
                        </div>
                        <div class="setting-row full-width">
                            <label for="set-dotnet-cli">.NET CLI Path</label>
                            <input type="text" id="set-dotnet-cli" name="dotnet_cli_path" placeholder="/path/to/dotnet">
                        </div>
                        <div class="setting-row full-width">
                            <label for="set-shared-tools-dir">Shared Tools Directory</label>
                            <input type="text" id="set-shared-tools-dir" name="shared_tools_dir" placeholder="/path/to/shared/tools">
                        </div>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div id="actions-modal" class="modal" role="dialog">
        <div class="modal-content">
            <h3>Incomplete Actions</h3>
            <div id="actions-modal-content" class="modal-body"></div>
            <button class="btn btn-secondary" onclick="closeActionsModal()">CLOSE</button>
        </div>
    </div>

    <div id="root-path-confirmation-modal" class="modal" role="dialog">
        <div class="modal-content">
            <h3>Confirm Root Directory Change</h3>
            <p>Are you sure you want to change the root directory? This will clear all run history.</p>
            <div class="modal-actions">
                <button class="btn btn-primary" onclick="confirmRootPathChangeProceed()">YES, CLEAR PATHS</button>
                <button class="btn btn-secondary" onclick="cancelRootPathChange()">CANCEL</button>
            </div>
        </div>
    </div>

    <!-- Notification / Alert Modal -->
    <div id="notification-modal" class="modal" role="dialog" aria-live="assertive">
        <div class="modal-content notification-modal-content">
            <div id="notification-icon" class="notification-icon"></div>
            <h3 id="notification-title"></h3>
            <div id="notification-body" class="notification-body"></div>
            <div class="modal-actions">
                <button class="btn btn-primary" id="notification-ok-btn" onclick="closeNotificationModal()">OK</button>
            </div>
        </div>
    </div>


    <script src="/static/site.js"></script>
</body>
</html>
